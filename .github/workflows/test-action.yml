name: Test action

# Exercises the action end-to-end against a live public MCP server, asserting
# its outputs — this is what proves the composite action actually works.
on:
  push:
    # Every branch, so a branch pushed without an open PR is still checked.
    # Without this a merged-then-reused branch can reach a release unverified.
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keyed by event, then head repo, then branch.
  #   event_name: a push run and its pull_request run must NOT share a group.
  #     They report onto the same PR, so cancelling one renders as a FAILED
  #     check and blocks merge even though CI passed.
  #   head repo: without it a fork PR whose head branch is named `main` (or two
  #     forks sharing a branch name) collides with an unrelated run.
  #   branch: consecutive pushes to one branch still supersede each other.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.head.repo.full_name || github.repository }}-${{
    github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  run-against-live-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: audit
        uses: ./
        with:
          target: https://mcp.deepwiki.com/mcp
          comment: "false" # no PR context on push; commenting is covered by real usage
      - name: Assert outputs are populated
        shell: bash
        env:
          SCORE: ${{ steps.audit.outputs.score }}
          MAX: ${{ steps.audit.outputs.max-score }}
          PCT: ${{ steps.audit.outputs.percentage }}
          ERA: ${{ steps.audit.outputs.era }}
        run: |
          echo "score=$SCORE/$MAX ($PCT%) era=$ERA"
          test -n "$SCORE"
          test "$ERA" = "legacy"
          test -f mcpscore-report.json

  sarif-file-is-written:
    # The end-to-end proof for `sarif-path`: the composite action, the real
    # CLI from PyPI, and a real server. Pinned to the first engine release with
    # --sarif so the job fails with the action's own "needs mcpscore 1.14.0"
    # message, not a mystery, if the pin is ever lowered.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          target: https://mcp.deepwiki.com/mcp
          version: "1.14.0"
          sarif-path: mcpscore.sarif
          comment: "false"
      - name: Assert the SARIF file exists and carries findings for the target
        shell: bash
        run: |
          test -f mcpscore.sarif
          python3 - <<'PY'
          import json
          run = json.load(open("mcpscore.sarif", encoding="utf-8"))["runs"][0]
          assert run["tool"]["driver"]["name"] == "mcpscore", run["tool"]
          assert run["results"], "no results: DeepWiki has failed rules, the file should carry them"
          for result in run["results"]:
              assert result["locations"][0]["physicalLocation"]["artifactLocation"]["uri"] == "mcp.deepwiki.com/mcp"
              assert "primaryLocationLineHash" in result["partialFingerprints"]
          print(f"{len(run['results'])} findings, all located on mcp.deepwiki.com/mcp")
          PY

  gate-passes-and-fails:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: A low threshold passes
        uses: ./
        with:
          target: https://mcp.deepwiki.com/mcp
          min-score: "10"
          comment: "false"
      - name: An impossible threshold fails (and we expect it to)
        id: strict
        continue-on-error: true
        uses: ./
        with:
          target: https://mcp.deepwiki.com/mcp
          min-score: "100"
          comment: "false"
      - name: Confirm the strict gate failed
        shell: bash
        env:
          OUTCOME: ${{ steps.strict.outcome }}
        run: test "$OUTCOME" = "failure"
